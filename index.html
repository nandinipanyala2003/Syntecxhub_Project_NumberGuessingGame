<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Number Guessing Game</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    padding: 30px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: rgba(0,0,0,0.4);
    padding: 25px;
    border-radius: 15px;
}

button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: #00ffd5;
}

input {
    padding: 10px;
    margin-top: 10px;
}

#message {
    margin-top: 15px;
    font-size: 18px;
}

.leaderboard {
    margin-top: 20px;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">
    <h1>🎯 Advanced Number Guessing Game</h1>

    <p>Select Difficulty:</p>
    <button onclick="startGame(50,15)">🥉 Easy</button>
    <button onclick="startGame(100,10)">🥈 Medium</button>
    <button onclick="startGame(200,7)">🥇 Hard</button>

    <div id="gameArea" style="display:none;">
        <p id="range"></p>

        <input type="number" id="guess" placeholder="Enter guess">
        <br>
        <button onclick="checkGuess()">Guess</button>
        <button onclick="restartGame()">Restart</button>

        <p id="message"></p>
        <p id="attempts"></p>
        <p id="timer"></p>
    </div>

    <div class="leaderboard">
        <h3>🏆 Leaderboard</h3>
        <ul id="scores"></ul>
    </div>
</div>

<script>
let secret, tries, maxTries, maxNum;
let startTime;

function startGame(num, attemptsLimit) {
    maxNum = num;
    maxTries = attemptsLimit;
    secret = Math.floor(Math.random() * maxNum) + 1;
    tries = 0;
    startTime = new Date();

    document.getElementById("gameArea").style.display = "block";
    document.getElementById("range").innerText =
        `Guess between 1 - ${maxNum} | Max tries: ${maxTries}`;

    document.getElementById("message").innerText = "";
    document.getElementById("attempts").innerText = "";
}

function checkGuess() {
    let guess = Number(document.getElementById("guess").value);
    let msg = document.getElementById("message");

    if (!guess) {
        msg.innerText = "❌ Enter a number!";
        return;
    }

    tries++;

    if (guess === secret) {
        let time = ((new Date() - startTime)/1000).toFixed(1);
        msg.innerText = `🎉 WIN! Attempts: ${tries} | Time: ${time}s`;

        let name = prompt("Enter your name:") || "Anonymous";
        saveScore(name, tries, time);
        showScores();
    } else if (tries >= maxTries) {
        msg.innerText = `💥 Game Over! Number was ${secret}`;
    } else {
        let diff = Math.abs(guess - secret);

        if (diff <= 5) msg.innerText = "🔥 HOT!";
        else if (diff <= 15) msg.innerText = "🌡️ Warm!";
        else msg.innerText = "❄️ Cold!";

        if (guess < secret) msg.innerText += " 📈 Higher";
        else msg.innerText += " 📉 Lower";
    }

    document.getElementById("attempts").innerText =
        `Attempts: ${tries}/${maxTries}`;
    document.getElementById("guess").value = "";
}

function restartGame() {
    startGame(maxNum, maxTries);
}

function saveScore(name, attempts, time) {
    let scores = JSON.parse(localStorage.getItem("scores")) || [];
    scores.push(`${name}: ${attempts} tries, ${time}s`);
    localStorage.setItem("scores", JSON.stringify(scores));
}

function showScores() {
    let list = document.getElementById("scores");
    list.innerHTML = "";

    let scores = JSON.parse(localStorage.getItem("scores")) || [];
    scores.slice(-5).reverse().forEach(score => {
        let li = document.createElement("li");
        li.textContent = score;
        list.appendChild(li);
    });
}

// load scores on start
showScores();
</script>

</body>
</html>
